## checkout
## java 21
## run tests
## upload artifacts

## build - checkout
## setup java 21
## package
## upload artifacts

name: this is demo of ci
on: workflow_dispatch

jobs:
  test-job:
    name: run tests job
    runs-on: ubuntu-24.04
    
    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          
      - name: run tests
        run: mvn test

      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: surefire reports
          path: target/surefire-reports/
          retention-days: 2

  build-package-job:
    name: build and package job
    needs: test-job
    runs-on: ubuntu-24.04
    
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
  
      - name: setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          
      - name: package app
        run: mvn package -DskipTests
  
      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: target/*.jar
          retention-days: 2
        
