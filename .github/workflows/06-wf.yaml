name: env var demo
on: 
  workflow_dispatch:
    inputs:
      select_env:
        default: Testing
        description: this is to select the environment before running
        type: choice
        options:
          - Testing
          - Developement
          - Production

jobs:
  dev-job:
    environment: ${{inputs.select_env}}
    runs-on: ubuntu-latest
    
    steps:
      - name: job1 step1 statements
        run: |
          echo "======================"
          echo "HOST_NAME name is ${{vars.HOST_NAME}}"     
          echo "HOST_PWD name is ${{secrets.HOST_PWD}}"   
          echo "======================"               
