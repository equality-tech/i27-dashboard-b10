name: env var demo
on: workflow_dispatch

jobs:
  dev-job:
    environment: Developement
    runs-on: ubuntu-latest
    
    steps:
      - name: job1 step1 statements
        run: |
          echo "======================"
          echo "HOST_NAME name is ${{vars.HOST_NAME}}"     
          echo "HOST_PWD name is ${{secrets.HOST_PWD}}"   
          echo "======================"               
      

  test-job:
    environment: Testing
    needs: dev-job
    runs-on: ubuntu-latest
    
    steps:
      - name: job2 step1 statements
        run: |
          echo "======================"
          echo "HOST_NAME name is ${{vars.HOST_NAME}}"     
          echo "HOST_PWD name is ${{secrets.HOST_PWD}}"   
          echo "======================"              


  prod-job:
    environment: Developement
    needs: test-job
    runs-on: ubuntu-latest
    
    steps:
      - name: job3 step1 statements
        run: |
          echo "======================"
          echo "HOST_NAME name is ${{vars.HOST_NAME}}"     
          echo "HOST_PWD name is ${{secrets.HOST_PWD}}"   
          echo "======================"  
