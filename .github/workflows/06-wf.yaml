name: env var demo
on: workflow_dispatch

jobs:
  first-job:
    runs-on: ubuntu-latest
    
    steps:
      - name: job1 step1 statements
        id: mystep1
        run: |
          echo "======================"
          echo "APP_NAME=my-demo-app">>"$GITHUB_OUTPUT"     
          echo "======================"               
      - name: job1 step2 steps
        run: |
          echo "======================"
          echo "${{steps.mystep1.outputs.APP_NAME}}"         
          echo "======================"  
    outputs:
      APP_NAME: ${{steps.mystep1.outputs.APP_NAME}}
      
  second-job:
    runs-on: ubuntu-latest
    needs: first-job
    steps:
      - name: job1 step1 statements
        id: mystep1
        run: |
          echo "======================"
          echo "${{needs.first-job.outputs.APP_NAME}}"     
          echo "======================"               
