name: env var demo
on: workflow_dispatch

env:
  APP_NAME: my-demo-app
  PORT: 3000

jobs:

  first-job:
    env:
      JOB1_ID: my-job1
    runs-on: ubuntu-latest
    steps:
      - name: printing the wf level env var
        run: |
          echo "======================"
          echo "APP_NAME is $APP_NAME"
          echo "PORT is $PORT"
          echo "PORT is $PORT"
          echo "JO1B_ID is $JOB1_ID"
          echo "======================"       
          
  second-job:
    needs: first-job
    runs-on: ubuntu-latest    
    env:
      JOB2_ID: my-job2
    steps:
      - name: printing the wf level env var
        run: |         
          echo "========OTHER WAY OF ACCESS=============="
          echo "APP_NAME is ${{env.APP_NAME}}"
          echo "PORT is ${{env.PORT}}"
          echo "JOB1_ID is $JOB1_ID"
          echo "JOB2_ID is $JOB2_ID"
          echo "======================"
