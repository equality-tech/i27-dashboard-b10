name: full ci workflow
on: workflow_dispatch

env:
  DOCKER_IMAGE_NAME: 'mdbasheer333/i27-academy-dashboard'

jobs:

  build-test-package:
    name: build, test and package job
    runs-on: ubuntu-24.04
    
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
  
      - name: setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      
      - name: test app
        run: mvn test
        
      - name: package app
        run: mvn clean package -DskipTests
  
      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: target/*.jar
          retention-days: 2
  
  build-package-job: 
    name: build and package
    runs-on: ubuntu-latest
    needs: build-test-package
    
    steps:  
      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      
      - name: docker build image
        run: docker build -t ${{env.DOCKER_IMAGE_NAME}}:${{github.sha}} .

      - name: docker push
        run: docker push ${{env.DOCKER_IMAGE_NAME}}:${{github.sha}} .

      - name: docker info
        run: docker images
     
