name: full ci workflow
on: workflow_dispatch

env:
  DOCKER_IMAGE_NAME: 'mdbasheer333/i27-academy-dashboard'

jobs:

  test-app:
    name: maven test app
    runs-on: ubuntu-24.04
    
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
  
      - name: setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      
      - name: test app
        run: mvn test
  
      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: surefire reports
          path: target/surefire-reports/
          retention-days: 2
  
  docker-build-package-push-job: 
    name: docker build, package and push
    runs-on: ubuntu-latest
    needs: test-app
    
    steps:  
      - name: checkout repo
        uses: actions/checkout@v7
        
      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      
      - name: docker build image
        run: docker build -t ${{env.DOCKER_IMAGE_NAME}}:${{github.sha}} .

      - name: docker info
        run: docker images
        
      - name: docker push
        run: docker push ${{env.DOCKER_IMAGE_NAME}}:${{github.sha}}

        
