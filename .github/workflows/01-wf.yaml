name: on push example
on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - closed
      - reopened
      - synchronize
      
jobs:

  first-job:
    runs-on: ubuntu-latest
    
    steps:
      - name: printing welcome message job1
        run: |
          sleep 10
          echo "welcome to github actions by job1"
          
      - name: printing bye message job1
        run: |
          echo "bye from job1"
          
      - name: printing 1 more bye message job1
        run: |
          echo "one more bye from job1"
          
  second-job:
  
    runs-on: ubuntu-latest
    needs: first-job
    
    steps:
      - name: printing hellow message job2
        run: |
          sleep 5
          echo "welcome to github actions by job2"
          
      - name: printing bye message job2
        run: |
          echo "bye from job2"

  third-job:
    runs-on: ubuntu-latest
    needs: 
      - first-job
      - second-job
    
    steps:
      - name: printing hellow message job3
        run: |
          sleep 5
          echo "welcome to github actions by job3"
          
      - name: printing bye message job3
        run: |
          echo "bye from job3"
